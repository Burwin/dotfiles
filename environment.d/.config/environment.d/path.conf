# Prepend ~/.local/bin and ~/.config/opencode/bin to PATH for the
# user-systemd manager and anything launched from it (graphical session,
# user services, alacritty, tmux …).
#
# Why this file exists: Omarchy's bash rc adds ~/.local/bin only for
# interactive shells, so non-interactive shells (notably tmux's #() shell
# used by status-right) can't find tools installed there — e.g.
# toggl-tmux-status and the rest of the toggl-* CLIs symlinked by
# bamboo/tools' install.sh. Putting it here makes the path visible
# system-wide for the user session, regardless of shell mode.
#
# ~/.config/opencode/bin hosts the `opencode-cost` CLI from the
# cost-tracker plugin (see docs/plans/opencode-cost-tracker/PLAN.md). It
# rides on this same file so the same non-interactive-shell visibility
# applies — e.g. invoking `opencode-cost` from a tmux popup or a
# systemd user timer.
PATH=${HOME}/.config/opencode/bin:${HOME}/.local/bin:${PATH}
