# Override omarchy default lid handler.
# omarchy-hyprland-monitor-internal {on,off} writes a toggle file and runs
# `hyprctl reload`, which races with aquamarine on hybrid-GPU multi-monitor
# setups (Hyprland 0.54.3) and crashes Hyprland. `hyprctl keyword monitor`
# is atomic and avoids the race. See ~/.cache/hyprland/hyprlandCrashReport*.txt.
#
# Lid-close handler avoids the i915 multi-monitor wedge by NOT taking eDP-1
# offline. `keyword monitor "eDP-1, disable"` triggers a re-modeset cascade
# across DP-6/DP-7 that strands a page-flip and freezes the externals'
# framebuffer (cursor still moves) on the first lid-close after boot.
#
# Strategy: focus an external, then put eDP-1 into `mirror` mode against
# that external (so cursor & workspaces can't escape onto the lidded panel),
# then DPMS-off the panel. Mirror entry was probed cascade-free on i915 — see
# docs/plans/hyprland-lid-externals-freeze/PLAN.md (candidate C) and
# https://github.com/hyprwm/aquamarine/issues/308.
#
# `[ -n "$ext" ] && ...` guards each mirror-dependent step so a missing
# external falls back to plain DPMS-off (cursor edge oddity, no wedge).
unbind = , switch:on:Lid Switch
unbind = , switch:off:Lid Switch
bindl = , switch:on:Lid Switch, exec, ext=$(hyprctl monitors -j | jq -r '.[] | select(.name != "eDP-1") | .name' | head -1); [ -n "$ext" ] && hyprctl dispatch focusmonitor "$ext"; hyprctl dispatch dpms off eDP-1; [ -n "$ext" ] && hyprctl keyword monitor "eDP-1, preferred, 0x0, 1, mirror, $ext"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, preferred, auto, auto"; hyprctl dispatch dpms on eDP-1
