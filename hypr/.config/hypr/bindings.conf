# bind = SUPER, H, exec, voxtype record toggle                 # Dictation Button
# bind = SUPER, PERIOD, exec, omarchy-launch-walker -m symbols # Emoji Button

# Override omarchy default lid handler.
# omarchy-hyprland-monitor-internal {on,off} writes a toggle file and runs
# `hyprctl reload`, which races with aquamarine on hybrid-GPU multi-monitor
# setups (Hyprland 0.54.3) and crashes Hyprland. `hyprctl keyword monitor`
# is atomic and avoids the race. See ~/.cache/hyprland/hyprlandCrashReport*.txt.
#
# Before disabling eDP-1, focus the first available external monitor. This
# stops the focused workspace from sitting on eDP-1 when it gets disabled,
# which on NVIDIA + Intel hybrid stalls the external monitors' framebuffer
# (cursor still moves, rest of screen frozen) on the first lid-close after
# boot. The disable runs unconditionally via `;`, so a missing/wrong external
# never blocks it.
unbind = , switch:on:Lid Switch
unbind = , switch:off:Lid Switch
bindl = , switch:on:Lid Switch, exec, ext=$(hyprctl monitors -j | jq -r '.[] | select(.name != "eDP-1") | .name' | head -1); [ -n "$ext" ] && hyprctl dispatch focusmonitor "$ext"; hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, preferred, auto, auto"
