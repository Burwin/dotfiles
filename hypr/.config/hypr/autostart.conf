# Extra autostart processes
# exec-once = uwsm-app -- my-service

# Workaround: lid-switch binding only fires on transitions, so booting
# with the lid closed leaves eDP-1 active. Apply the same atomic
# `hyprctl keyword monitor` we use in bindings.conf if the lid is closed
# at Hyprland startup. See docs/archive/2026-05-07-hyprland-lid-switch.md.
exec-once = sh -c 'grep -q "state:.*closed" /proc/acpi/button/lid/LID*/state 2>/dev/null && hyprctl keyword monitor "eDP-1, disable"'
